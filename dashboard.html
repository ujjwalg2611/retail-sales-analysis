:root{--bg:#f6f7f9;--card:#fff;--tx:#1b1f24;--mu:#5d6773;--ac:#2563eb;--bd:#e2e6ea;--warn:#fff4d6;--wt:#6b4e00;

:root[data-theme="dark"]{--bg:#14171a;--card:#1d2226;--tx:#e8ebee;--mu:#9aa5b1;--ac:#6ea0ff;--bd:#2c343a;--warn:#3a2f10;--wt:#f2d98a}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:1000px;margin:0 auto;padding:16px}
h1{font-size:20px;margin:0 0 4px}h2{font-size:14px;margin:0 0 10px}
.note{background:var(--warn);color:var(--wt);padding:8px 12px;border-radius:8px;margin:10px 0;font-size:13px}
.bar{display:flex;gap:10px;flex-wrap:wrap;margin:10px 0}
select{background:var(--card);color:var(--tx);border:1px solid var(--bd);border-radius:8px;padding:6px 8px;font:inherit}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(280px,1fr))}
.kpis{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(140px,1fr))}
.card{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:12px;min-width:0}
.kpi b{display:block;font-size:22px}.kpi span{color:var(--mu);font-size:12px}
.cols{display:flex;align-items:flex-end;gap:4px;height:150px}
.col{flex:1;background:var(--ac);border-radius:3px 3px 0 0;min-height:2px;position:relative}
.col.hi{opacity:.55}
.lbl{display:flex;gap:4px;margin-top:4px}.lbl i{flex:1;text-align:center;font-style:normal;font-size:10px;color:var(--mu)}
.row{display:flex;align-items:center;gap:8px;margin:6px 0;font-size:13px}
.row .n{width:110px;flex:none;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .t{flex:1;background:var(--bd);border-radius:4px;height:12px}.row .f{background:var(--ac);height:100%;border-radius:4px}
.row .v{width:62px;text-align:right;flex:none;color:var(--mu)}
table{width:100%;border-collapse:collapse;font-size:13px}td,th{padding:5px 4px;border-bottom:1px solid var(--bd);text-align:left}
.sc{overflow-x:auto}.r{text-align:right}

const fm=n=>n>=1e6?(n/1e6).toFixed(2)+"M":n>=1e3?(n/1e3).toFixed(1)+"K":n.toFixed(0);
const uniq=k=>[...new Set(D.rows.map(r=>r[k]))].sort();

for(const [id,k,all] of [["fc","category","All categories"],["fr","region","All regions"]]){
  $(id).innerHTML=`<option value="">${all}</option>`+uniq(k).map(v=>`<option>${v}</option>`).join("");

function group(rows,k){const m={};rows.forEach(r=>{m[r[k]]=(m[r[k]]||0)+r.revenue});return Object.entries(m).sort((a,b)=>b[1]-a[1]);}
function bars(id,rows,k){const g=group(rows,k),mx=Math.max(...g.map(x=>x[1]),1);
